<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maarten de Klerk — UI/UX Designer &amp; Web Developer</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://maartendeklerk.nl/nl/index.html" />
  <!-- Taalkeuze: Engelstalige browsers naar /en/, anders /nl/ (meta refresh als fallback) -->
  <script>
    var toEN = (navigator.language || "").toLowerCase().indexOf("nl") !== 0 &&
               (navigator.language || "").toLowerCase().indexOf("en") === 0;
    window.location.replace(toEN ? "en/index.html" : "nl/index.html");
  </script>
  <meta http-equiv="refresh" content="0; url=nl/index.html" />
</head>
<body>
  <p><a href="nl/index.html">Nederlands</a> · <a href="en/index.html">English</a></p>
</body>
</html>
